# Windows build: FileZilla engine (no GUI), the M0b spike and totzillad,
# each tested against a local SFTP server (tests/sftp_test_server.py).
# libfilezilla and fzssh come prebuilt from MSYS2 (UCRT64); MSYS2 also packages
# FileZilla 3.71.1 against them, so the versions are known to work together.
name: Build
on:
  workflow_dispatch:
  push:
    paths:
      - third_party/filezilla/**
      - spike/**
      - daemon/**
      - tests/**
      - app/**
      - locales/**
      - .github/workflows/build.yml
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make tar xz
          pacboy: >-
            toolchain:p autotools:p pkgconf:p
            libfilezilla:p fzssh:p gnutls:p nettle:p sqlite3:p boost:p
            nlohmann-json:p python-paramiko:p
      - name: Dependency versions
        run: pacman -Q | grep -E 'libfilezilla|fzssh|gnutls|nettle|nlohmann|gcc '
      - name: Verify FileZilla source tarball
        run: |
          # Same hash as the MSYS2 and Arch Linux packages of FileZilla 3.71.1.
          echo "3df9b9b3e5b2c37dc6d9ecb883554aba140a02ec47c3d6b52333bf1733af4da4  third_party/filezilla/FileZilla_3.71.1_src.tar.xz" | sha256sum -c
      - name: Configure FileZilla (GUI disabled)
        run: |
          mkdir src-fz && tar xf third_party/filezilla/FileZilla_3.71.1_src.tar.xz -C src-fz --strip-components=1
          mkdir build-fz && cd build-fz
          ../src-fz/configure --prefix="$MINGW_PREFIX" \
            --build="$MINGW_CHOST" --host="$MINGW_CHOST" \
            --enable-gui=no --disable-locales --disable-shellext --disable-storj \
            --disable-manualupdatecheck --disable-autoupdatecheck \
            --with-pugixml=builtin
      - name: Build engine
        run: make -j"$(nproc)" -C build-fz/src
      - name: Collect engine output
        if: always()
        run: |
          mkdir -p out/bin out/lib out/include
          cp build-fz/config.log out/ 2>/dev/null || true
          find build-fz/src -name '*.dll' -exec cp {} out/bin/ \;
          find build-fz/src -name '*.dll.a' -exec cp {} out/lib/ \;
          cp src-fz/src/include/*.h out/include/ 2>/dev/null || true
          ls -laR out
          test -n "$(ls out/bin/*.dll 2>/dev/null)"
      - name: Build M0b spike
        run: |
          g++ -std=c++17 -O2 -Wall -Isrc-fz/src/include \
            $(pkg-config --cflags libfilezilla libfzssh-client) \
            spike/m0b/main.cpp -o out/bin/fzspike.exe \
            -Lbuild-fz/src/engine/.libs -lfzclient-private \
            $(pkg-config --libs libfilezilla libfzssh-client)
      - name: Build totzillad
        run: |
          sh daemon/build.sh src-fz build-fz out/bin "0.1.0-dev+${GITHUB_SHA::7}"
          PATH="$PWD/out/bin:$PATH" totzillad.exe --version
      - name: Test M0b spike (connect, list, upload)
        timeout-minutes: 5
        env:
          TOTZILLA_PASSWORD: test
        run: |
          export PATH="$PWD/out/bin:$PATH"
          mkdir sftproot && echo "already on the server" > sftproot/existing.txt
          python tests/sftp_test_server.py --root sftproot --port 3373 --password "$TOTZILLA_PASSWORD" &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 5
          echo "uploaded by the M0b spike at $(date -u)" > upload.txt
          fzspike.exe --host 127.0.0.1 --port 3373 --user test --trust-hostkey \
            --upload "$(cygpath -w "$PWD/upload.txt")" --timeout 20
          cmp upload.txt sftproot/upload.txt
          echo "server copy matches"
      - name: Test totzillad JSON-RPC
        timeout-minutes: 5
        run: |
          export PATH="$PWD/out/bin:$PATH"
          mkdir sftproot-daemon
          python tests/sftp_test_server.py --root sftproot-daemon --port 3374 --password test &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 5
          python daemon/tests/test_rpc.py "$(cygpath -w "$PWD/out/bin/totzillad.exe")" \
            --port 3374 --password test --root sftproot-daemon
      - name: Bundle totzillad with its DLLs
        run: |
          mkdir -p out/daemon
          cp out/bin/totzillad.exe out/daemon/
          # Every non-system DLL the daemon loads, resolved with the engine on PATH.
          PATH="$PWD/out/bin:$PATH" ldd out/daemon/totzillad.exe \
            | awk '$3 ~ /^\// {print $3}' | grep -vi '^/c/windows' | sort -u \
            | while read -r dll; do cp "$dll" out/daemon/; done
          # The engine is built with -g; ship it without debug info.
          strip --strip-unneeded out/daemon/*.exe out/daemon/*.dll
          ls -la out/daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-build
          path: out/

  app:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: native
      - name: Place bundled daemon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/daemon | Out-Null
          Copy-Item native/daemon/* app/src-tauri/daemon/
          Get-ChildItem app/src-tauri/daemon
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Check frontend
        working-directory: app
        run: npm run check
      - name: Unit tests
        working-directory: app
        run: npm test
      - name: Build app and installer
        working-directory: app
        run: npx tauri build --bundles nsis
      - name: Install silently and self-test
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'TOTzilla'
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notmatch 'uninstall' | Select-Object -First 1
          $report = Join-Path $env:RUNNER_TEMP 'self-test.json'
          $p = Start-Process -Wait -PassThru -FilePath $exe.FullName -ArgumentList '--self-test', $report
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/Cargo.lock
