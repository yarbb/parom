# Windows build: FileZilla engine (no GUI) and paromd,
# each tested against a local SFTP server (tests/sftp_test_server.py).
# libfilezilla and fzssh come prebuilt from MSYS2 (UCRT64); MSYS2 also packages
# FileZilla 3.71.1 against them, so the versions are known to work together.
# A tag "vX.Y.Z" also publishes a GitHub release and the update feed
# (job "release" at the end).
name: Build
on:
  workflow_dispatch:
  push:
    branches: ['**']
    # Path filters are not applied to tag pushes, so every version tag builds.
    tags: ['v*']
    paths:
      - third_party/filezilla/**
      - daemon/**
      - tests/**
      - app/**
      - locales/**
      - .github/workflows/build.yml
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make tar xz
          pacboy: >-
            toolchain:p autotools:p pkgconf:p
            libfilezilla:p fzssh:p gnutls:p nettle:p sqlite3:p boost:p
            nlohmann-json:p python-paramiko:p python-pyopenssl:p python-cryptography:p python-pip:p
      - name: Dependency versions
        run: pacman -Q | grep -E 'libfilezilla|fzssh|gnutls|nettle|nlohmann|gcc '
      - name: Verify FileZilla source tarball
        run: |
          # Same hash as the MSYS2 and Arch Linux packages of FileZilla 3.71.1.
          echo "3df9b9b3e5b2c37dc6d9ecb883554aba140a02ec47c3d6b52333bf1733af4da4  third_party/filezilla/FileZilla_3.71.1_src.tar.xz" | sha256sum -c
      - name: Configure FileZilla (GUI disabled)
        run: |
          mkdir src-fz && tar xf third_party/filezilla/FileZilla_3.71.1_src.tar.xz -C src-fz --strip-components=1
          mkdir build-fz && cd build-fz
          ../src-fz/configure --prefix="$MINGW_PREFIX" \
            --build="$MINGW_CHOST" --host="$MINGW_CHOST" \
            --enable-gui=no --disable-locales --disable-shellext --disable-storj \
            --disable-manualupdatecheck --disable-autoupdatecheck \
            --with-pugixml=builtin
      - name: Build engine
        run: make -j"$(nproc)" -C build-fz/src
      - name: Collect engine output
        if: always()
        run: |
          mkdir -p out/bin out/lib out/include
          cp build-fz/config.log out/ 2>/dev/null || true
          find build-fz/src -name '*.dll' -exec cp {} out/bin/ \;
          find build-fz/src -name '*.dll.a' -exec cp {} out/lib/ \;
          cp src-fz/src/include/*.h out/include/ 2>/dev/null || true
          ls -laR out
          test -n "$(ls out/bin/*.dll 2>/dev/null)"
      - name: Build paromd
        run: |
          VERSION=$(tr -d '\r' < app/package.json | sed -n 's/^  "version": "\(.*\)",$/\1/p')
          sh daemon/build.sh src-fz build-fz out/bin "$VERSION+${GITHUB_SHA::7}"
          PATH="$PWD/out/bin:$PATH" paromd.exe --version
      - name: Test paromd JSON-RPC
        timeout-minutes: 5
        run: |
          export PATH="$PWD/out/bin:$PATH"
          mkdir sftproot-daemon
          python tests/sftp_test_server.py --root sftproot-daemon --port 3374 --password test &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 5
          python daemon/tests/test_rpc.py "$(cygpath -w "$PWD/out/bin/paromd.exe")" \
            --port 3374 --password test --root sftproot-daemon
      - name: Test paromd FTP and FTPS
        timeout-minutes: 5
        run: |
          export PATH="$PWD/out/bin:$PATH"
          # pyftpdlib is not packaged by MSYS2; pyOpenSSL and cryptography are.
          python -m pip install --disable-pip-version-check --break-system-packages pyftpdlib
          mkdir ftproot ftpsroot
          python tests/ftp_test_server.py --root ftproot --port 2121 --password test &
          FTP_PID=$!
          python tests/ftp_test_server.py --root ftpsroot --port 2221 --password test --tls &
          FTPS_PID=$!
          trap 'kill $FTP_PID $FTPS_PID 2>/dev/null || true' EXIT
          sleep 5
          python daemon/tests/test_ftp.py "$(cygpath -w "$PWD/out/bin/paromd.exe")" --password test \
            --ftp-port 2121 --ftp-root ftproot --ftps-port 2221 --ftps-root ftpsroot
      - name: Bundle paromd with its DLLs
        run: |
          mkdir -p out/daemon
          cp out/bin/paromd.exe out/daemon/
          # Every non-system DLL the daemon loads, resolved with the engine on PATH.
          PATH="$PWD/out/bin:$PATH" ldd out/daemon/paromd.exe \
            | awk '$3 ~ /^\// {print $3}' | grep -vi '^/c/windows' | sort -u \
            | while read -r dll; do cp "$dll" out/daemon/; done
          # The engine is built with -g; ship it without debug info.
          strip --strip-unneeded out/daemon/*.exe out/daemon/*.dll
          ls -la out/daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-build
          path: out/

  app:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: native
      - name: Place bundled daemon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/daemon | Out-Null
          Copy-Item native/daemon/* app/src-tauri/daemon/
          Get-ChildItem app/src-tauri/daemon
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Check frontend
        working-directory: app
        run: npm run check
      - name: Unit tests
        working-directory: app
        run: npm test
      - name: Build app and installer
        working-directory: app
        shell: bash
        # The commit is shown next to the version, so a build can be told apart.
        # The key signs the installer for the updater (a .sig next to it).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: VITE_BUILD="${GITHUB_SHA::7}" npx tauri build --bundles nsis
      - name: Install silently and self-test
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'Parom'
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notmatch 'uninstall' | Select-Object -First 1
          $report = Join-Path $env:RUNNER_TEMP 'self-test.json'
          $p = Start-Process -Wait -PassThru -FilePath $exe.FullName -ArgumentList '--self-test', $report
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            app/src-tauri/Cargo.lock

  # Linux (experimental): libfilezilla and fzssh built from source (the
  # tarballs Arch Linux mirrors, checked against Arch's sums), the engine and
  # paromd, then the AppImage. Built on Ubuntu 24.04, so it runs on distros
  # with glibc 2.39 or newer.
  linux:
    runs-on: ubuntu-24.04
    env:
      FZ: /opt/fz
      LIBFILEZILLA: '0.58.0'
      LIBFILEZILLA_SHA512: 8bcfe47e4c704e0fd4ed66da47e834b031ed4f6dd66a7e4f7991a7e87f3c88f38b822d58de83c0f4f84118b87c9a8ff1ac00913a40fb692718c49ad8063bd83a
      FZSSH: '1.5.0'
      FZSSH_SHA256: 2289e1e7c3fc11d3720b69ee6bee40490c0b3d5bca21d7d0615dfca1d833786d
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build meson patchelf file xz-utils gettext \
            nettle-dev libgnutls28-dev libgmp-dev libargon2-dev libsqlite3-dev nlohmann-json3-dev libboost-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev libssl-dev \
            python3-paramiko
      - name: libfilezilla and fzssh
        run: |
          set -eu
          curl -fsSLo lfz.tar.xz "https://sources.archlinux.org/other/libfilezilla/libfilezilla-$LIBFILEZILLA.tar.xz"
          echo "$LIBFILEZILLA_SHA512  lfz.tar.xz" | sha512sum -c
          curl -fsSLo fzssh.tar.xz "https://sources.archlinux.org/other/packages/fzssh/fzssh-$FZSSH.tar.xz"
          echo "$FZSSH_SHA256  fzssh.tar.xz" | sha256sum -c
          mkdir lfz fzssh
          tar xf lfz.tar.xz -C lfz --strip-components=1
          tar xf fzssh.tar.xz -C fzssh --strip-components=1
          (cd lfz && ./configure --prefix="$FZ" --disable-static && make -j"$(nproc)" && sudo make install)
          export PKG_CONFIG_PATH="$FZ/lib/pkgconfig"
          meson setup fzssh-build fzssh --prefix="$FZ" --libdir=lib --buildtype=release
          ninja -C fzssh-build
          sudo ninja -C fzssh-build install
      - name: Engine and paromd
        run: |
          set -eu
          export PKG_CONFIG_PATH="$FZ/lib/pkgconfig" LD_LIBRARY_PATH="$FZ/lib"
          echo "3df9b9b3e5b2c37dc6d9ecb883554aba140a02ec47c3d6b52333bf1733af4da4  third_party/filezilla/FileZilla_3.71.1_src.tar.xz" | sha256sum -c
          mkdir src-fz build-fz
          tar xf third_party/filezilla/FileZilla_3.71.1_src.tar.xz -C src-fz --strip-components=1
          (cd build-fz && ../src-fz/configure --prefix="$FZ" \
            --enable-gui=no --disable-locales --disable-shellext --disable-storj \
            --disable-manualupdatecheck --disable-autoupdatecheck --with-pugixml=builtin)
          make -j"$(nproc)" -C build-fz/src
          VERSION=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' app/package.json)
          sh daemon/build.sh src-fz build-fz out "$VERSION+${GITHUB_SHA::7}"
          LD_LIBRARY_PATH="$FZ/lib:$PWD/build-fz/src/engine/.libs" out/paromd --version
      - name: Bundle paromd with its libraries
        run: |
          set -eu
          mkdir -p app/src-tauri/daemon
          cp out/paromd app/src-tauri/daemon/
          # Everything it loads except the C runtime itself; found through $ORIGIN.
          LD_LIBRARY_PATH="$FZ/lib:$PWD/build-fz/src/engine/.libs" ldd out/paromd \
            | awk '$3 ~ /^\// {print $3}' \
            | grep -vE '/(libc|libm|libdl|libpthread|librt|ld-linux[^/]*)\.so' \
            | while read -r lib; do cp -L "$lib" app/src-tauri/daemon/; done
          for f in app/src-tauri/daemon/*; do patchelf --set-rpath '$ORIGIN' "$f"; done
          strip --strip-unneeded app/src-tauri/daemon/* || true
          ls -la app/src-tauri/daemon
          app/src-tauri/daemon/paromd --version
      - name: Test paromd JSON-RPC
        timeout-minutes: 5
        run: |
          mkdir sftproot-daemon
          python3 tests/sftp_test_server.py --root sftproot-daemon --port 3374 --password test &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 5
          python3 daemon/tests/test_rpc.py "$PWD/app/src-tauri/daemon/paromd" \
            --port 3374 --password test --root sftproot-daemon
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build the AppImage
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm ci
          VITE_BUILD="${GITHUB_SHA::7}" npx tauri build --bundles appimage
      - name: Self-test the AppImage
        run: |
          set -eu
          img=$(ls app/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          echo "AppImage: $img ($(du -h "$img" | cut -f1))"
          chmod +x "$img"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$img" --appimage-extract >/dev/null)
          bin=$(ls "$RUNNER_TEMP"/squashfs-root/usr/bin/* | head -n1)
          "$bin" --self-test "$RUNNER_TEMP/self-test.json" || { cat "$RUNNER_TEMP/self-test.json"; exit 1; }
          cat "$RUNNER_TEMP/self-test.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-appimage
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  # On a version tag: the GitHub release (pre-release while the version is
  # below 1.0 or has a suffix) and the update feed the app reads. The feed is
  # latest.json in the fixed release "updater", because GitHub's "latest
  # release" link skips pre-releases.
  release:
    needs: [app, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-appimage
          path: dist-linux
      - name: Publish the release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SETUP=$(find dist -name '*-setup.exe' | head -n1)
          SIG="$SETUP.sig"
          test -f "$SETUP" && test -f "$SIG"
          NOTES="docs/releases/$VERSION.md"
          test -f "$NOTES" || { echo "missing $NOTES"; exit 1; }
          PRE=""
          case "$VERSION" in 0.*|*-*) PRE="--prerelease" ;; esac
          TITLE="Parom $VERSION"
          [ -n "$PRE" ] && TITLE="$TITLE beta"
          APPIMAGE=$(find dist-linux -name '*.AppImage' | head -n1)
          gh release create "$TAG" "$SETUP" "$APPIMAGE" --title "$TITLE" --notes-file "$NOTES" $PRE --verify-tag
      - name: Update the feed for the app's updater
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SETUP=$(find dist -name '*-setup.exe' | head -n1)
          NAME=$(basename "$SETUP")
          APPIMAGE=$(find dist-linux -name '*.AppImage' | head -n1)
          LNAME=$(basename "$APPIMAGE")
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(cat "docs/releases/$VERSION.md")" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$SETUP.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$NAME" \
            --arg lsig "$(cat "$APPIMAGE.sig")" \
            --arg lurl "https://github.com/$GH_REPO/releases/download/$TAG/$LNAME" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url},
                          "linux-x86_64": {signature: $lsig, url: $lurl}}}' > latest.json
          cat latest.json
          gh release view updater >/dev/null 2>&1 || gh release create updater --prerelease \
            --title "Update feed" --notes "Read by the app to find new versions. Download Parom from the releases above."
          gh release upload updater latest.json --clobber
