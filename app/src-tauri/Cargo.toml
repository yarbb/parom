[package]
name = "totzilla"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "totzilla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Linux (Secret Service) comes with the Linux build; without a backend feature keyring uses an in-memory mock there.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
