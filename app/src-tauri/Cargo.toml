[package]
name = "parom"
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "parom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Updates from GitHub Releases (signed) and the restart after them.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The system's drag and drop for dragging files out of the window.
tauri-plugin-drag = "2.1"
# Linux (Secret Service) comes with the Linux build; without a backend feature keyring uses an in-memory mock there.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
open = "5"
# HTTPS remotes for fetch / pull / push (WinHTTP on Windows, Secure
# Transport on macOS, OpenSSL on Linux); no SSH transport.
git2 = { version = "0.21", default-features = false, features = ["https"] }
# GitHub REST API (rustls, so no system TLS library is needed).
ureq = { version = "2.12", features = ["json"] }
tokio = { version = "1", features = ["sync"] }
# Live changes in the GitHub tab (watches the open repository's folder).
notify = "8"

# Saved passwords on Linux go to the Secret Service (GNOME Keyring, KWallet).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Windows 11 snap layouts for the custom maximize button (sends Win+Z).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
