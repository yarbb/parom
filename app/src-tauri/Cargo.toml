[package]
name = "totzilla"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "totzilla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Linux (Secret Service) comes with the Linux build; without a backend feature keyring uses an in-memory mock there.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
open = "5"
# HTTPS remotes for fetch / pull / push (WinHTTP on Windows, Secure
# Transport on macOS, OpenSSL on Linux); no SSH transport.
git2 = { version = "0.21", default-features = false, features = ["https"] }
# GitHub REST API (rustls, so no system TLS library is needed).
ureq = { version = "2.12", features = ["json"] }
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
